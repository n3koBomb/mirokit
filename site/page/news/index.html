<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="The latest news, events and stories from the international MIRoKIT community." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="News from MIRoKIT" />
  <meta property="og:description" content="Encounters, ideas and stories from our international community." />
  <meta property="og:url" content="https://mirokit.com/news/" />
  <title>News from MIRoKIT — MIRoKIT</title>
  <link rel="canonical" href="https://mirokit.com/news/" />
  <link rel="icon" href="/public/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/source/style/style.css" />
  <link rel="stylesheet" href="/source/style/subpage.css" />
  <link rel="stylesheet" href="/page/news/news.css" />
  <link rel="stylesheet" href="/source/style/news-shared.css" />
</head>
<body class="news-page">
  <a class="nw-skip" href="#newsArchive" data-key="ga_skip">Skip to content</a>
  <header class="subpage-header">
    <a class="subpage-brand" href="/" data-i18n-attrs="aria-label:op_library_home"><img src="/public/assets/brand/miroKit_logo_full-1.png" alt="MIRoKIT" width="144" height="48" /></a>
    <a class="subpage-home" href="/"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span data-key="op_library_home">Back to home</span></a>
    <div class="subpage-actions">
      <button class="subpage-theme" type="button" data-theme-toggle aria-pressed="false"><span aria-hidden="true">◐</span><span class="theme-toggle-label" data-key="theme_dark">Dark</span></button>
      <label class="sr-only" for="newsLanguage" data-key="language_label">Language</label>
      <select class="subpage-lang" id="newsLanguage" data-lang-select data-i18n-attrs="aria-label:language_selector"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select>
    </div>
  </header>
  <main class="nw-main" id="newsArchive" tabindex="-1">
    <header class="nw-archive-head"><span class="nw-kicker">MIRoKIT / NEWS</span><h1 id="newsArchiveTitle">News from MIRoKIT</h1><p class="nw-introduction" id="newsIntroduction"></p></header>
    <section aria-labelledby="newsArchiveTitle">
      <div class="nw-toolbar">
        <div class="nw-filters" id="newsFilters" role="group" data-i18n-attrs="aria-label:news_filter_label" aria-label="Filter news by category"></div>
        <label class="nw-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span class="sr-only" data-key="news_search">Search news</span><input id="newsSearch" type="search" maxlength="200" data-i18n-attrs="placeholder:news_search" /></label>
        <label class="nw-sort"><span class="sr-only" data-key="ga_sort">Sort by</span><select id="newsSort"><option value="newest" data-key="ga_newest">Newest first</option><option value="featured" data-key="ga_featured">Featured first</option><option value="title" data-key="ga_az">Title A–Z</option></select></label>
      </div>
      <div class="nw-results"><p id="newsCount" role="status" aria-live="polite"></p><button id="newsClear" type="button" data-key="ga_clear" hidden>Clear search</button></div>
      <div class="nw-load-state" id="newsLoadState" role="status"><span id="newsLoadMessage"></span><button id="newsRetry" type="button" hidden>Try again</button></div>
      <div id="newsFeatured"></div>
      <div class="nw-grid" id="newsGrid" aria-busy="true"></div>
      <p class="nw-empty" id="newsEmpty" hidden></p>
      <noscript><p>JavaScript is required for the news overview. Articles can be opened directly using their permanent addresses.</p></noscript>
    </section>
  </main>
  <script src="/source/scripts/language.js"></script>
  <script src="/source/scripts/subpage.js"></script>
  <script type="module" src="/page/news/news.js"></script>
</body>
</html>
