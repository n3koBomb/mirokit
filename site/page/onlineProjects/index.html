<!DOCTYPE html>
<html lang="ru">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="description" content="Фотоархив онлайн-конкурсы Международной лиги «МИРоКИТ»." />
      <meta name="robots" content="index, follow" />
      <title>Онлайн-конкурсы — МИРоКИТ</title>
      <link rel="canonical" href="https://mirokit.com/page/onlineProjects/" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
      <link rel="icon" type="image/x-icon" href="../../public/favicon/favicon.ico" />
      <link rel="stylesheet" href="../../source/style/style.css" />
      <link rel="stylesheet" href="./online-projects.css" />
      <link rel="stylesheet" href="../../source/style/subpage.css" />
   </head>
   <body class="online-project-page">
      <header class="subpage-header">
         <a class="subpage-brand" href="../../index.html#onlineProjects" data-i18n-attrs="aria-label:op_library_home">
            <img src="../../public/assets/brand/miroKit_logo_full-1.png" alt="MIRoKIT" />
         </a>
         <a class="subpage-home" href="../../index.html#onlineProjects"><span aria-hidden="true">↖</span><span data-key="op_library_home">На главную</span></a>
         <div class="subpage-actions">
            <a class="subpage-contact" href="../../index.html#contact"><span data-key="contact_title">Контакты</span></a>
            <button class="subpage-theme" type="button" data-theme-toggle aria-pressed="false">
               <i class="fa-solid fa-moon" aria-hidden="true"></i><span class="theme-toggle-label" data-key="theme_dark">Dark</span>
            </button>
            <label class="sr-only" for="projectLangSelect" data-key="language_label">Language</label>
            <select class="subpage-lang" id="projectLangSelect" data-lang-select data-i18n-attrs="aria-label:language_selector">
               <option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option>
            </select>
         </div>
      </header>

      <main class="online-project-page-main" id="onlineProjectMain">
         <section class="online-project-page-intro" aria-labelledby="onlineProjectPageTitle">
            <span class="online-project-page-kicker" data-key="op0t">МИРоКИТ без границ</span>
            <h1 id="onlineProjectPageTitle" data-key="menu_onlineProjects">Онлайн-конкурсы</h1>
            <p data-key="op_library_intro">Десять направлений, множество идей. Откройте тему и вдохновляйтесь работами участников.</p>
         </section>

         <nav class="online-project-filters" id="onlineProjectFilters" data-i18n-attrs="aria-label:online_projects_tabs_label"></nav>

         <section aria-labelledby="onlineProjectPhotosTitle">
            <div class="online-project-page-toolbar">
               <div><span class="online-project-page-kicker" data-key="op_library_eyebrow">Галерея работ</span><h2 id="onlineProjectPhotosTitle" tabindex="-1"></h2></div>
               <span class="online-project-page-count" id="onlineProjectPhotoCount" role="status"></span>
            </div>
            <div class="online-project-photo-grid" id="onlineProjectPhotoGrid" aria-busy="true"></div>
            <div class="online-project-page-empty" id="onlineProjectEmpty" hidden>
               <i class="fa-regular fa-images" aria-hidden="true"></i><p id="onlineProjectEmptyText"></p>
               <button type="button" id="onlineProjectRetry" data-key="op_library_retry" hidden>Попробовать снова</button>
            </div>
            <noscript><p>Для просмотра галереи включите JavaScript. / Enable JavaScript to view the gallery. / Bitte JavaScript für die Galerie aktivieren.</p></noscript>
         </section>
      </main>

      <dialog class="online-project-page-modal" id="onlineProjectPhotoModal" aria-labelledby="onlineProjectModalTitle" aria-describedby="onlineProjectModalSubtitle">
         <div class="online-project-page-modal-card">
            <div class="online-project-modal-topline">
               <span id="onlineProjectModalCount" aria-live="polite"></span>
               <button type="button" id="onlineProjectModalClose" data-i18n-attrs="aria-label:op_library_close" autofocus><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
            <div class="online-project-page-modal-stage">
               <img id="onlineProjectModalImage" alt="" />
               <p id="onlineProjectModalError" data-key="op_library_image_error" role="status" hidden>Не удалось загрузить изображение.</p>
            </div>
            <div class="online-project-page-modal-footer">
               <div class="online-project-modal-copy"><span class="online-project-page-kicker" id="onlineProjectModalTopic"></span><h2 id="onlineProjectModalTitle"></h2><p id="onlineProjectModalSubtitle"></p></div>
               <div class="online-project-modal-controls">
                  <button type="button" id="onlineProjectModalPrevious" data-i18n-attrs="aria-label:op_library_previous"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
                  <button type="button" id="onlineProjectModalNext" data-i18n-attrs="aria-label:op_library_next"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                  <a id="onlineProjectModalOriginal" target="_blank" rel="noopener noreferrer" data-i18n-attrs="aria-label:op_library_original"><i class="fa-solid fa-up-right-and-down-left-from-center" aria-hidden="true"></i><span data-key="op_library_original">Оригинал</span></a>
               </div>
            </div>
         </div>
      </dialog>
      <script src="../../source/scripts/language.js"></script>
      <script type="module" src="./online-projects.js"></script>
   </body>
</html>
