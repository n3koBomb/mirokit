<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="robots" content="noindex, nofollow" />
      <title>Oops — Page not found | MIRoKIT</title>
      <style>
         :root { color-scheme: light; font-family: system-ui, sans-serif; background: #eef4ff; color: #0d1b4b; }
         body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
         main { width: min(100%, 560px); padding: clamp(28px, 7vw, 64px); border: 1px solid #d8e4ff; border-radius: 28px; background: #fff; box-shadow: 0 18px 60px rgb(13 27 75 / 12%); text-align: center; }
         strong { display: block; margin-bottom: 12px; color: #1565ff; font-size: clamp(3rem, 12vw, 6rem); line-height: 1; }
         h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2.4rem); }
         p { margin: 0 0 28px; color: #4e5b7c; line-height: 1.6; }
         a { display: inline-block; padding: 12px 20px; border-radius: 999px; background: #1565ff; color: #fff; font-weight: 700; text-decoration: none; }
         a:focus-visible { outline: 3px solid #ff3d3d; outline-offset: 4px; }
      </style>
   </head>
   <body>
      <main>
         <strong>404</strong>
         <h1>Oops — this content is not available.</h1>
         <p>The page may have moved, or the address may be incorrect.</p>
         <a href="/">Return to MIRoKIT</a>
      </main>
   </body>
</html>
